name: PipelineMedic TypeScript Build Test

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create TypeScript project
        run: |
          mkdir compiler-test
          cd compiler-test
          npm init -y
          npm install typescript
          printf 'const total: number = "PipelineMedic";\nconsole.log(total);\n' > app.ts

      - name: Compile TypeScript application
        run: |
          cd compiler-test
          npx tsc app.ts --noEmit
